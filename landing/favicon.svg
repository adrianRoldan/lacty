<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#3B82F6"/>

  <!-- Hair -->
  <ellipse cx="50" cy="22" rx="22" ry="16" fill="#C8956C"/>
  <ellipse cx="34" cy="28" rx="13" ry="12" fill="#C8956C"/>
  <ellipse cx="66" cy="28" rx="13" ry="12" fill="#C8956C"/>

  <!-- Face -->
  <circle cx="50" cy="56" r="34" fill="#FFD5B0"/>

  <!-- Eyes whites -->
  <circle cx="38" cy="50" r="7" fill="white"/>
  <circle cx="62" cy="50" r="7" fill="white"/>
  <!-- Pupils -->
  <circle cx="39.5" cy="51" r="4" fill="#3D2B1F"/>
  <circle cx="63.5" cy="51" r="4" fill="#3D2B1F"/>
  <!-- Eye shine -->
  <circle cx="41" cy="49.5" r="1.5" fill="white"/>
  <circle cx="65" cy="49.5" r="1.5" fill="white"/>

  <!-- Rosy cheeks -->
  <circle cx="28" cy="60" r="7" fill="#FF9B9B" opacity="0.45"/>
  <circle cx="72" cy="60" r="7" fill="#FF9B9B" opacity="0.45"/>

  <!-- Smile -->
  <path d="M 38 65 Q 50 76 62 65" stroke="#B56A40" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
