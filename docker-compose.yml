services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      # La app escribe aquí el sitemap.xml para que lo sirva Caddy como
      # fichero estático, disponible incluso mientras se despliega.
      - ./landing:/app/landing
    environment:
      # Los avisos comparan la hora del servidor con las horas que configura la
      # familia («el masaje toca a las 08:30»). Sin esto el contenedor va en UTC
      # y en España llegarían con una o dos horas de retraso.
      TZ: Europe/Madrid
      DATA_DIR: /app/data
      SESSION_SECRET: ${SESSION_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
